[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = false
optimizer = true
optimizer_runs = 999999

[profile.ci]
# CI inherits everything from default. Defining the profile silences the
# "profile `ci` does not exist" warning emitted by GitHub Actions runs.

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[rpc_endpoints]
main_net="${MAIN_NET_URL}"
local_net="${LOCAL_CHAIN_URL}"
sepolia="${SEPOLIA_URL}"